[project]
name = "cuhkx-har"
version = "0.1.0"
description = "Leakage-safe lightweight multimodal HAR solution for the CUHK-X Small Model Track"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "autogluon-tabular[all]>=1.6.1",
  "matplotlib>=3.9",
  "numpy>=2.1",
  "pandas>=2.2",
  "pillow>=11.0",
  "scikit-learn>=1.6",
  "torch>=2.7",
  "torchvision>=0.22",
  "tqdm>=4.67",
]

[project.optional-dependencies]
sep12 = ["lightgbm>=4.6", "ultralytics==8.4.121"]

[project.scripts]
cuhkx-sep12-prepare = "cuhkx_sep12.prepare:main"
cuhkx-sep12-train = "cuhkx_sep12.train:main"
cuhkx-sep12-lightgbm = "cuhkx_sep12.lightgbm:main"
cuhkx-index = "cuhkx_har.manifest:main"
cuhkx-cache = "cuhkx_har.features:main"
cuhkx-train = "cuhkx_har.train:main"
cuhkx-monitor = "cuhkx_har.monitor:main"
cuhkx-ablate = "cuhkx_har.ablate:main"
cuhkx-predict = "cuhkx_har.predict:main"
cuhkx-check-submission = "cuhkx_har.submission:main"
cuhkx-ensemble-oof = "cuhkx_har.ensemble_oof:main"
cuhkx-cv-report = "cuhkx_har.cv:main"
cuhkx-stress-test = "cuhkx_har.stress:main"
cuhkx-modality-train = "cuhkx_modality.train:main"
cuhkx-modality-report = "cuhkx_modality.report:main_report"
cuhkx-modality-summary = "cuhkx_modality.report:main_summary"
cuhkx-modality-plot = "cuhkx_modality.plot:main"
cuhkx-automl = "cuhkx_har.automl:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cuhkx_har", "src/cuhkx_modality", "src/cuhkx_sep12", "src/cuhkx_sep13", "src/cuhkx_sep14", "src/cuhkx_sep15", "src/cuhkx_public"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
